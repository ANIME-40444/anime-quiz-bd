<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Quiz BD - Sign Up</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCJ5XnhKIM9isFqqlhZ0kAdG8DLUsR1TTY",
    authDomain: "anime-quiz-bd.firebaseapp.com",
    projectId: "anime-quiz-bd",
    storageBucket: "anime-quiz-bd.firebasestorage.app",
    messagingSenderId: "888165764863",
    appId: "1:888165764863:web:33a9d7d14a26bc7c4b46ca",
    measurementId: "G-STX5S01SS0"
  };
  firebase.initializeApp(firebaseConfig);
</script>
</head>
<body>
<div class="container">
  <h2>Sign Up</h2>
  <input type="text" id="name" placeholder="Full Name" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password (6 chars)" required>
  <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
  <button onclick="signup()">Sign Up</button>
  <p>Already have an account? <a href="index.html">Login</a></p>
</div>

<script>
  const auth = firebase.auth();

  function signup() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(!name || !email || !password || !confirmPassword){
      alert("Please fill all fields");
      return;
    }
    if(password.length !== 6){
      alert("Password must be exactly 6 characters");
      return;
    }
    if(password !== confirmPassword){
      alert("Passwords do not match");
      return;
    }

    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        alert("Account Created Successfully!");
        window.location.href = "index.html"; // Redirect to Login
      })
      .catch((error) => {
        alert(error.message);
      });
  }
</script>
</body>
</html>
